name: Vanilla local prototype CI

on:
  push:
    paths:
      - 'prototypes/vanilla-local/**'
      - '.github/workflows/vanilla-local.yml'
  pull_request:
    paths:
      - 'prototypes/vanilla-local/**'
      - '.github/workflows/vanilla-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and build (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/vanilla-local
    env:
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GAMEDOCK_E2E_ACCEPT_EULA: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.10'
          architecture: x64
          cache-dependency-path: prototypes/vanilla-local/go.sum

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check JavaScript syntax
        run: node --check frontend/app.js

      - name: Build the Windows desktop app
        run: go build -trimpath -buildvcs=false '-tags=desktop,production' '-ldflags=-H=windowsgui' -o "$env:RUNNER_TEMP/GameDock.exe" .
